apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: default
  name: mongo-express-deployment
  labels:
    app: mongo-express
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-express
  template:
    metadata:
      labels:
        app: mongo-express
    spec:
      containers:
        - name: mongo-express
          image: mongo-express
          env:
            - name: ME_CONFIG_MONGODB_URL
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: db_url
            - name: ME_CONFIG_BASICAUTH_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: mongo-express-configmap
                  key: basicauth_enabled
            - name: ME_CONFIG_BASICAUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-express-secret
                  key: username
            - name: ME_CONFIG_BASICAUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-express-secret
                  key: password
---
apiVersion: v1
kind: Service
metadata:
  namespace: default
  name: mongo-express-service
spec:
  selector:
    app: mongo-express
  # type: LoadBalancer
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: default
  name: mongo-express-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - mongo-express.retroofan.dedyn.io
      secretName: mongo-express-tls-cert
  rules:
    - host: mongo-express.retroofan.dedyn.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mongo-express-service
                port:
                  number: 8081
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: default
  name: mongo-express-configmap
data:
  basicauth_enabled: "true"
